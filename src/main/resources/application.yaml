spring:
  application:
    name: ticketbook
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ticketdb
      auto-index-creation: true
  config:
    import: optional:file:.env[.properties]
secret:
  key:
      ${SECRET_KEY}
stripe:
  api:
    key:
      ${STRIPE_SECRET}
  secret:
         ${STRIPE_API}
